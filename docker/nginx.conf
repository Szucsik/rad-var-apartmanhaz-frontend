server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Emit path-relative redirects, so a TLS-terminating proxy keeps https.
  absolute_redirect off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/yaml application/javascript application/json application/xml image/svg+xml;

  # /en/ -> /en (same as src/.htaccess)
  rewrite ^/(hu|pl|en|de)/$ /$1 permanent;

  # Single-page app: every language URL is rendered by index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # .htaccess and friends end up in the build output; never serve them.
  location ~ /\.(?!well-known) {
    deny all;
  }

  # The entry point must never be cached, otherwise a new deployment is invisible.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Hashed bundles and fonts can be cached forever.
  location ~* \.(?:js|css|woff2?|ttf|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Images and videos are not hashed, so keep their cache short.
  location ~* \.(?:jpg|jpeg|png|webp|avif|svg|gif|mp4)$ {
    add_header Cache-Control "public, max-age=2592000";
  }

  # Translation YAML is loaded at runtime and may be updated without a rebuild.
  location ~ \.yaml$ {
    default_type text/yaml;
    add_header Cache-Control "no-cache";
  }

  location = /robots.txt {
    add_header Cache-Control "no-cache";
  }

  location = /sitemap.xml {
    add_header Cache-Control "no-cache";
  }
}
