services:
  web:
    image: ${IMAGE:-ghcr.io/szucsik/rad-var-apartmanhaz-frontend:latest}
    container_name: rad-var-apartmanhaz-frontend
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
