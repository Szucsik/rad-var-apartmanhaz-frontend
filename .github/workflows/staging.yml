ftp-server: wh24.rackhost.hu
ftp-user: c32709szucsik
ftp-password: ${{ secrets.FTP_PW  }}
deploy-dir: ./dist/rad-var-apartmanhaz/
server-dir: ./staging/

name: Staging deploy

on:
  push:
    branches: [ develop, staging ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: NPM Install
      run: npm ci

    - name: List packages & versions
      run: npm list

    - name: Angular Build
      run: npm run ng build

    - name: Get all Files
      run: ls

    - name: Deploy
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{  ftp-server }}
        username: ${{  ftp-user }}
        password: ${{  ftp-password }}
        local-dir: ${{ deploy-dir }}
        server-dir: ${{ server-dir }}