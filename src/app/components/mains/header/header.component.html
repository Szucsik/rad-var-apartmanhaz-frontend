<div class="header-background-color header-container" #container [ngClass]="{'mobile-blur': isMobileResolution && !isMobileMenuActive}">
    <div class="mobile-menu">
        <div class="logo-container" (click)="this.scrollAnimationService.navigate('home')">
            <app-logo #logo></app-logo>
        </div>
        <div class="mobile-burger-button" (click)="this.showMobileMenu()"></div>
    </div>
    <div class="header-menu-item-details menu-item" [ngClass]="{'mobile-hidden': isMobileResolution && !isMobileMenuActive}">
        <button pButton pRipple type="button" class="p-button-raised header-menu-button-details btns" (click)="this.scrollAnimationService.navigate('gallery')">Galéria</button>
    </div>
    <div class="header-menu-item-details menu-item" [ngClass]="{'mobile-hidden': isMobileResolution && !isMobileMenuActive}">
        <button pButton pRipple type="button" class="p-button-raised header-menu-button-details btns" (click)="this.scrollAnimationService.navigate('booking')">Foglalás</button>
    </div>
    <div class="header-menu-item-details menu-item" [ngClass]="{'mobile-hidden': isMobileResolution && !isMobileMenuActive}">
        <button pButton pRipple type="button" class="p-button-raised header-menu-button-details btns" (click)="this.scrollAnimationService.navigate('history')">Történet</button>
    </div>
    <div class="header-menu-item-details menu-item" [ngClass]="{'mobile-hidden': isMobileResolution && !isMobileMenuActive}">
        <button pButton pRipple type="button" class="p-button-raised header-menu-button-details btns" (click)="this.scrollAnimationService.navigate('contacts')">Elérhetőségek</button>
    </div>
    <div class="header-menu-item-details lang-item" [ngClass]="{'mobile-hidden': isMobileResolution && !isMobileMenuActive}">
        <p-speedDial [model]="items" [direction]="langDirection"></p-speedDial>
    </div>
</div>
