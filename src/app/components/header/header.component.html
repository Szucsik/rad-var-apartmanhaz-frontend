<div class="header-background-color header-container" #container>
    <div class="header-logo-details logo-container" (click)="this.scrollAnimationService.navigate('home')">
        <app-logo [context]="contextName" #logo></app-logo>
    </div>
    <div class="header-menu-item-details menu-item">
        <button pButton pRipple type="button" class="p-button-raised header-menu-button-details btns" (click)="this.scrollAnimationService.navigate('gallery')">Galéria</button>
    </div>
    <div class="header-menu-item-details menu-item">
        <button pButton pRipple type="button" class="p-button-raised header-menu-button-details btns" (click)="this.scrollAnimationService.navigate('contacts')">Elérhetőségek</button>
    </div>
    <div class="header-menu-item-details menu-item">
        <button pButton pRipple type="button" class="p-button-raised header-menu-button-details btns" (click)="this.scrollAnimationService.navigate('nearby')">Közeli helyek</button>
    </div>
    <div class="header-menu-item-details menu-item">
        <button pButton pRipple type="button" class="p-button-raised header-menu-button-details btns" (click)="this.scrollAnimationService.navigate('book')">Foglalás</button>
    </div>
    <div class="header-menu-item-details lang-item">
        <p-speedDial [model]="items" direction="left"></p-speedDial>
    </div>
</div>
