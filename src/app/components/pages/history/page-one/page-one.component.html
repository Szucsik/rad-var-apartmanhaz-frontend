<div #topic1 class="history-topic-container topic-1">
    <h2 class="history-topic-title history-title">{{ t('history.title') }}</h2>
    <p class="history-topic-title-part-2 history-subtitle">{{ t('history.subtitleLine1') }}</p>
    <p class="history-topic-title-part-2 history-subtitle">{{ t('history.subtitleLine2') }}<span class="history-title-dot">.</span></p>
    <hr class="history-title-line">
    <h3 class="history-topic history-subtitle">{{ t('history.pages.intro.title') }}</h3>
    <div class="history-topic-body">
        <img class="history-image history-image-left history-image-2-page-1" src="assets/site-images/history-images/almagyar-7.jpg" [alt]="tList('history.pages.intro.imageAlts')[0]">
        <div class="history-topic-texts">
            @for (paragraph of tList('history.pages.intro.paragraphs'); track $index) {
                <p class="history-topic-text history-text">{{ paragraph }}</p>
            }
        </div>
        <img class="history-image history-image-right history-image-1-page-1" src="assets/site-images/history-images/almagyar-2.jpg" [alt]="tList('history.pages.intro.imageAlts')[1]">
    </div>
</div>
