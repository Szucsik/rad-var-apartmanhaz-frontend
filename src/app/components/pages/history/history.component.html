<div class="history-container">
    <div #timeline class="timeline-container">
        <div class="timeline-line" *ngFor="let topic of topics; index as i">
            <div class="timeline-dot" [ngClass]="{'timeline-dot-active': i == focus}"></div>
            <div class="timeline-active-highlight" [ngClass]="{'timeline-hidden-highlight': i != focus}">
                <p #timelineText class="timeline-highlight-text history-text">{{ t('history.pages.' + topic + '.timeline') }}</p>
            </div>
        </div>
    </div>
    <app-history-page-one [observeStart]="inactivePages[0]" (onPage)="changeFocus($event)"></app-history-page-one>
    <app-history-page-two [observeStart]="inactivePages[1]" (onPage)="changeFocus($event)"></app-history-page-two>
    <app-history-page-three [observeStart]="inactivePages[2]" (onPage)="changeFocus($event)"></app-history-page-three>
</div>
