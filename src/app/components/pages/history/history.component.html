<div class="history-container">
    <div class="timeline-container">
        <div class="timeline-line" *ngFor="let topic of topics; index as i">
            <div class="timeline-dot" [ngClass]="{'timeline-dot-active': i == focus}"></div>
            <div class="timeline-active-highlight" [ngClass]="{'timeline-hidden-highlight': i != focus}"></div>
        </div>
    </div>
    <div class="history-topic-1-container">
        <p class="history-topic-1-title history-title">Rövid történelme</p>
        <p class="history-topic-1-title-part-2 history-title">A Rád-Vár-Apartmanháznak</p>
    </div>
</div>
