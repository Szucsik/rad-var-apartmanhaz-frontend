<swiper #swiperGallery
    [autoHeight]="true"
    [effect]="'cards'"
    [grabCursor]="true"
    [pagination]="true"
    [loop]="true"
    [autoplay]="{ delay: 1000, disableOnInteraction: true }"
    (slideChange)="onSlideChange()"
    class="gallery-swiper"
>
    <ng-template data-swiper-autoplay="6000" swiperSlide *ngFor="let image of images; index as i">
        <img class="swiper-image" src="{{ image }}" alt="">
    </ng-template>
</swiper>
