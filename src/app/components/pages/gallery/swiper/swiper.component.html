<swiper-container #swiperGallery
    autoHeight="true"
    effect="cards"
    grabCursor="true"
    pagination="true"
    autoplay="{ delay: 1000, disableOnInteraction: true }"
    (slideChange)="onSlideChange()"
    class="gallery-swiper"
>
    <swiper-slide class="swiper-slide" *ngFor="let image of images; index as i">
        <img class="swiper-image" src="{{ image }}" alt="">
    </swiper-slide>
</swiper-container>
