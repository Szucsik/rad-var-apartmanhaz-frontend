<div #swiperGallery class="gallery-swiper swiper">
    <div class="swiper-wrapper">
        @for (image of images; track image) {
            <div class="swiper-slide" data-swiper-autoplay="6000">
                <img class="swiper-image" [src]="image" alt="">
            </div>
        }
    </div>
</div>
