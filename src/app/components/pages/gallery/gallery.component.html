<div class="gallery-container gallery-text" #content>
    <div class="gallery-content">
        <div class="gallery-header">
            <div class="gallery-title">
                Galéria
            </div>
            <div class="gallery-subtitle">
                Saját képeink
            </div>
            <hr class="gallery-title-line">
        </div>
        <div class="image-container">
            <div class="images">
                <gallery-swiper></gallery-swiper>
            </div>
            <div class="image-container-controllers">
                <div class="gallery-previous-button" (click)="this.NextImage('left')">
                    <img class="arrow-left" src="/assets/site-images/arrow-left.png" alt="..." >
                    <p class="gallery-left-button-text" href="#">Előző kép</p>
                </div>
                <div class="gallery-next-button" (click)="this.NextImage('right')">
                    <p class="gallery-right-button-text">Következő kép</p>
                    <img class="arrow-right" src="/assets/site-images/arrow-right.png" alt="...">
                </div>
            </div> 
        </div>
    </div>
</div>
