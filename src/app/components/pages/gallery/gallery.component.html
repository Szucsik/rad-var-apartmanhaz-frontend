<div class="gallery-container" #content>
    <div class="gallery-content">
        <div class="gallery-header">
            <div class="gallery-title">
                Galéria
            </div>
            <div class="gallery-counter">
                {{ this.currentImageID + 1}}/{{ this.imageSources.length }}
            </div>
        </div>
        <div class="image-container">
            <div class="box-rectangle"></div>
            <img class="arrow-left" src="/assets/site-images/arrow-left.png" alt="..." (click)="this.scroll('left')">
            <img class="gallery" src="{{ currentImageSource }}" alt="..." #gallery>
            <img class="arrow-right" src="/assets/site-images/arrow-right.png" alt="..." (click)="this.scroll('right')">
        </div>
    </div>
</div>
