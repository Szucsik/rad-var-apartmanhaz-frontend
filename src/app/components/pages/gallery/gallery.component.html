<div class="gallery-container gallery-text" #content>
    <div class="gallery-content">
        <div class="gallery-header">
            <div class="gallery-title">
                Galéria
            </div>
            <div class="gallery-subtitle">
                Saját képeink
            </div>
            <hr class="gallery-title-line">
        </div>
        <div class="image-container">
            <div class="images">
                <img class="gallery-previous-image-hidden" src="{{ this.galleryService.GetPreviousHiddenImageSource() }}" alt="..." #galleryPrevHid>
                <img class="gallery-previous-image gallery-sub-image" src="{{ this.galleryService.GetPreviousImageSource() }}" alt="..." #galleryPrev>
                <img class="gallery-main-image" src="{{ this.galleryService.GetCurrentImageSource() }}" alt="..." #galleryMain (click)="this.TurnFullscreen(true)" [ngClass]="{'gallery-link': !isAnimationOngoing}">
                <img class="gallery-next-image gallery-sub-image" src="{{ this.galleryService.GetNextImageSource() }}" alt="..." #galleryNext>
                <img class="gallery-next-image-hidden" src="{{ this.galleryService.GetNextHiddenImageSource() }}" alt="..." #galleryNextHid>
            </div>
            <div class="image-container-controllers">
                <div class="gallery-previous-button" (click)="this.galleryService.NextImage('left')">
                    <img class="arrow-left" src="/assets/site-images/arrow-left.png" alt="..." >
                    <p class="gallery-left-button-text" href="#">Előző kép</p>
                </div>
                <div class="gallery-next-button" (click)="this.NextImage()">
                    <p class="gallery-right-button-text">Következő kép</p>
                    <img class="arrow-right" src="/assets/site-images/arrow-right.png" alt="...">
                </div>
            </div> 
        </div>
    </div>
</div>
