<div class="gallery-container gallery-text" #content>
    <div class="gallery-content">
        <div class="gallery-header">
            <div class="gallery-title">
                Galéria
            </div>
            <div class="gallery-subtitle">
                Saját képeink
            </div>
            <hr class="gallery-title-line">
        </div>
        <div class="image-container">
            <div class="images">
                <img class="gallery-previous-image" src="{{ this.galleryService.GetCurrentImageSource() }}" alt="..." #gallery (click)="this.galleryService.FullScreen(true)">
                <img class="gallery-main-image" src="{{ this.galleryService.GetCurrentImageSource() }}" alt="..." #gallery (click)="this.galleryService.FullScreen(true)">
                <img class="gallery-next-image" src="{{ this.galleryService.GetCurrentImageSource() }}" alt="..." #gallery (click)="this.galleryService.FullScreen(true)">
            </div>
            <div class="image-container-controllers">
                <div class="gallery-previous-button">
                    <img class="arrow-left" src="/assets/site-images/arrow-left.png" alt="..." (click)="this.galleryService.NextImage('left')">
                    <p>Előző kép</p>
                </div>
                <div class="gallery-next-button">
                    <p>Következő kép</p>
                    <img class="arrow-right" src="/assets/site-images/arrow-right.png" alt="..." (click)="this.galleryService.NextImage('right')">
                </div>
            </div> 
        </div>
    </div>
</div>
