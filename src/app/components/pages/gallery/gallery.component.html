<div class="gallery-container" #content>
    <div class="gallery-content">
        <div class="gallery-header">
            <div class="gallery-title">
                Galéria
            </div>
            <div class="gallery-counter">
                {{ this.galleryService.GetCurrentImageID() + 1}}/{{ this.galleryService.GetImagesNumber() }}
            </div>
        </div>
        <div class="image-container">
            <img class="arrow-left" src="/assets/site-images/arrow-left.png" alt="..." (click)="this.galleryService.NextImage('left')">
            <div class="image">
                <img class="gallery" src="{{ this.galleryService.GetCurrentImageSource() }}" alt="..." #gallery (click)="this.galleryService.FullScreen(true)">
            </div>
            <img class="arrow-right" src="/assets/site-images/arrow-right.png" alt="..." (click)="this.galleryService.NextImage('right')">
        </div>
    </div>
</div>
