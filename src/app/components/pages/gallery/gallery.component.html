<div class="gallery-container gallery-text" #content>
    <div class="gallery-content">
        <div class="gallery-header">
            <div class="gallery-title">
                {{ t('gallery.title') }}
            </div>
            <div class="gallery-subtitle">
                {{ t('gallery.subtitle') }}
            </div>
            <hr class="gallery-title-line">
        </div>
        <div class="image-container">
            <div class="images">
                <gallery-swiper #swiper></gallery-swiper>
            </div>
            <div class="image-container-controllers">
                <div class="gallery-previous-button" role="button" tabindex="0" [attr.aria-label]="t('gallery.previous')" (click)="this.swiper.PrevImage();" (keydown.enter)="this.swiper.PrevImage();">
                    <img class="arrow-left" src="/assets/site-images/arrow-left.png" alt="">
                </div>
                <div class="gallery-image-descriptor-container">
                    <p class="gallery-image-descriptor-text">{{ this.galleryService.getPhotoDescriptions()[this.galleryService.GetCurrentImageID()] }}</p>
                </div>
                <div class="gallery-next-button" role="button" tabindex="0" [attr.aria-label]="t('gallery.next')" (click)="this.swiper.NextImage();" (keydown.enter)="this.swiper.NextImage();">
                    <img class="arrow-right" src="/assets/site-images/arrow-right.png" alt="">
                </div>
            </div> 
        </div>
    </div>
</div>
