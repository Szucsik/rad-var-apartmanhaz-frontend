<app-loading *ngIf="!loaded"></app-loading>
<div [ngClass]="{'hidden': !loaded}">
    <app-header></app-header>
    <app-start *ngIf="this.config.getLoadingContentNeeded()"></app-start>
    <div [ngClass]="{'loading-container': !startAnimationFinished}">
        <app-main></app-main>
    </div>
</div>
